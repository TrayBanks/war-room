name: Refresh War Room
# Refreshes at 6 AM, 12 PM, 5 PM and 11:30 PM Central. GitHub delays and sometimes drops scheduled runs, so a light
# gate job runs every 30 minutes and refreshes only when the live page is older than the latest of those times.
# A missed slot is picked up within half an hour. Daylight saving is handled by computing the slots in Central time.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/**", "model/season_page/**", "extension/data.js", "extension/engine.js", "extension/lock.js", "data/locks.json", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Refresh only if the live page is older than the latest slot
        id: gate
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            now=$(date +%s); d=$(TZ=America/Chicago date +%F); slot=0
            for t in 06:00 12:00 17:00 23:30; do
              s=$(TZ=America/Chicago date -d "$d $t" +%s); [ "$s" -le "$now" ] && slot=$s
            done
            [ "$slot" -eq 0 ] && slot=$(TZ=America/Chicago date -d "$(TZ=America/Chicago date -d yesterday +%F) 23:30" +%s)
            last=$(curl -fsS "https://traybanks.github.io/war-room/status.json?t=$now" | python3 -c 'import json,sys; print(json.load(sys.stdin)["updated"])' || echo 1970-01-01T00:00:00Z)
            [ "$(date -d "$last" +%s)" -lt "$slot" ] || go=false
            echo "latest slot $(TZ=America/Chicago date -d @$slot '+%a %H:%M %Z'), page updated $last, refresh: $go"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull Sleeper, run the models, build the page
        run: tools/refresh.sh site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Monday snapshot (also keeps the schedule alive; GitHub pauses it after 60 days without commits)
        if: github.event_name == 'schedule'
        run: |
          d=$(TZ=America/Chicago date +%F)
          if [ "$(TZ=America/Chicago date +%u)" = 1 ] && [ ! -f "data/history/$d.json" ]; then
            mkdir -p data/history && cp site/status.json "data/history/$d.json"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history && git commit -m "Weekly snapshot $d" && git push
          fi
