name: Refresh War Room
# Refreshes at 6 AM, 12 PM, 5 PM and 11:30 PM Central. GitHub delays and sometimes drops scheduled runs, so a light
# gate job runs every 30 minutes and refreshes only when the live page is older than the latest of those times.
# A missed slot is picked up within half an hour. Daylight saving is handled by computing the slots in Central time.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/**", "model/season_page/**", "extension/data.js", "extension/engine.js", "extension/lock.js", "data/locks.json", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Refresh only if the live page is older than the latest slot
        id: gate
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            now=$(date +%s); d=$(TZ=America/Chicago date +%F); slot=0
            for t in 06:00 12:00 17:00 23:30; do
              s=$(TZ=America/Chicago date -d "$d $t" +%s); [ "$s" -le "$now" ] && slot=$s
            done
            [ "$slot" -eq 0 ] && slot=$(TZ=America/Chicago date -d "$(TZ=America/Chicago date -d yesterday +%F) 23:30" +%s)
            last=$(curl -fsS "https://traybanks.github.io/war-room/status.json?t=$now" | python3 -c 'import json,sys; print(json.load(sys.stdin)["updated"])' || echo 1970-01-01T00:00:00Z)
            [ "$(date -d "$last" +%s)" -lt "$slot" ] || go=false
            echo "latest slot $(TZ=America/Chicago date -d @$slot '+%a %H:%M %Z'), page updated $last, refresh: $go"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    timeout-minutes: 16
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull Sleeper, run the models, build the page
        timeout-minutes: 6
        run: tools/refresh.sh site
      - name: Save snapshot branch (the artifact sync publishes from it)
        run: |
          set -e
          mkdir -p /tmp/snap && cp -r data/live reports/slot10_war_room.html site /tmp/snap/
          cp reports/season_*.json reports/trending_*.json /tmp/snap/ 2>/dev/null || true
          cd /tmp/snap && git init -q -b snapshot && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot:snapshot
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages' deploy API often fails for a moment (HTTP 500, or "artifact not found" right after upload).
      # Try three times, a minute apart, before failing the run.
      - name: Deploy
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - name: Deploy (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before the last deploy try
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - name: Deploy (retry 2)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Monday snapshot (also keeps the schedule alive; GitHub pauses it after 60 days without commits)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          d=$(TZ=America/Chicago date +%F)
          if [ "$(TZ=America/Chicago date +%u)" = 1 ] && [ ! -f "data/history/$d.json" ]; then
            mkdir -p data/history && cp site/status.json "data/history/$d.json"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history && git commit -m "Weekly snapshot $d" && git push
          fi
